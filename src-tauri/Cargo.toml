[package]
name = "sunshine-library-sync"
version = "1.0.4"
description = "A local-first Sunshine library synchronizer for Windows"
edition = "2021"
rust-version = "1.90"
default-run = "sunshine-library-sync"

[lib]
name = "sunshine_library_sync"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs", "macros"] }
tokio-util = "0.7"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks", "system-proxy", "stream"] }
url = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
